{{ define "admin-auth-bridge" }}
{{ template "header" .}}

<section class="login">
	<h2>{{ .L.T "users.login" }}</h2>
	<p>Signing you in...</p>
</section>

<script>
	(function() {
		var payload = {{ .Data.PayloadJSON }};
		var next = String({{ printf "%q" .Data.NextURI }});
		next = next.replace(/^["']+|["']+$/g, '');
		if (!next || next === '/') {
			next = '/admin';
		}
		window.localStorage.setItem('pocketbase_auth', JSON.stringify(payload));
		window.location.replace(next);
	})();
</script>

{{ template "footer" .}}
{{ end }}
